
name: Build ThockType2Click for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --name ThockType2Click --add-data "sounds;sounds" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ThockType2Click-Windows
          path: dist/ThockType2Click.exe
